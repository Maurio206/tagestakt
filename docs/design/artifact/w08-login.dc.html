<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Anmelden</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tagestakt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f3efe8}a:hover{color:#ffffff}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></symbol>
</defs>
</svg>
<div class="web" style="min-height: 900px; align-items: center; justify-content: center; padding: 48px 16px">
  <main style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: #f3efe8; stroke-width: 1.5; stroke-linecap: round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"></rect><path d="M8 15.5v-3M12 15.5v-7M16 15.5v-5"></path></svg>
      <div>
        <p class="eyebrow">TagesTakt</p>
        <h1 style="font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin-top: 4px">Anmelden</h1>
        <p class="muted" style="margin-top: 8px">Privater Zugang. Eine Registrierung ist nicht möglich.</p>
      </div>
    </div>
    <form style="display: flex; flex-direction: column; gap: 16px">
      <div class="field"><label for="l-mail">E-Mail</label><input id="l-mail" class="input" type="email" autocomplete="username" value="beispiel@tagestakt.test"></div>
      <div class="field"><label for="l-pass">Passwort</label><input id="l-pass" class="input err" type="password" autocomplete="current-password" aria-invalid="true" aria-describedby="l-pass-err" value=""><p id="l-pass-err" class="ferr">Bitte das Passwort eingeben.</p></div>
      <button class="btn btn-primary btn-lg" type="button" style="width: 100%">Anmelden</button>
    </form>
    <p class="subtle" style="font-size: 13px; line-height: 1.55; display: flex; gap: 8px; border-top: 1px solid var(--line); padding-top: 18px"><svg class="ic ic-sm" style="margin-top: 2px"><use href="#i-lock"></use></svg>Die Sitzung liegt nur in einem geschützten Cookie dieses Browsers. Passwort-Manager werden unterstützt.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
