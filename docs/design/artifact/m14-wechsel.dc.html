<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Aktivität wechseln</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tagestakt.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f3efe8}a:hover{color:#ffffff}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"></rect></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"></polygon></symbol>
<symbol id="i-briefcase" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><rect width="20" height="14" x="2" y="6" rx="2"></rect></symbol>
<symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M14.4 14.4 9.6 9.6"></path><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path><path d="m21.5 21.5-1.4-1.4"></path><path d="M3.9 3.9 2.5 2.5"></path><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"></path></symbol>
</defs>
</svg>
<div class="phone">
  <div class="inset-top"></div>
  <header class="appbar"><div><h1 style="font-size: 22px">Mittwoch, 14. Oktober</h1><p class="sub num">KW 42 · 18:05 Uhr</p></div></header>
  <main class="content">
    <section class="now g-business"><span class="chip" style="align-self: flex-start">Gewerbe</span><h2 class="title">Kundenprojekt</h2><p class="big num">1:01:12</p></section>
  </main>
  <div class="scrim"></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="w-title" aria-describedby="w-desc">
    <span class="handle"></span>
    <h2 id="w-title">Gewerbe läuft noch</h2>
    <p id="w-desc" class="muted" style="font-size: 15px; line-height: 1.5">Es läuft immer nur eine Aktivität. „Kundenprojekt“ läuft seit 17:04 – soll sie jetzt enden?</p>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); align-items: center; gap: 8px; padding: 14px; border-radius: 14px; background: var(--s2); border: 1px solid var(--line)">
      <div class="g-business" style="display: flex; flex-direction: column; gap: 4px"><span class="chip" style="align-self: flex-start"><svg class="ic ic-sm"><use href="#i-briefcase"></use></svg>Gewerbe</span><span class="num" style="font-size: 14px">endet um 18:05 · 1:01</span></div>
      <svg class="ic" style="color: var(--text-3)"><use href="#i-arrow"></use></svg>
      <div class="g-sport" style="display: flex; flex-direction: column; gap: 4px"><span class="chip" style="align-self: flex-start"><svg class="ic ic-sm"><use href="#i-dumbbell"></use></svg>Sport</span><span style="font-size: 14px">startet jetzt, spontan</span></div>
    </div>
    <button class="btn btn-primary btn-lg btn-block" type="button"><svg class="ic ic-fill"><use href="#i-play"></use></svg>Gewerbe beenden, Sport starten</button>
    <button class="btn btn-secondary btn-block" type="button"><svg class="ic ic-fill"><use href="#i-stop"></use></svg>Nur Gewerbe beenden</button>
    <button class="btn btn-ghost btn-block" type="button">Abbrechen – Gewerbe läuft weiter</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
